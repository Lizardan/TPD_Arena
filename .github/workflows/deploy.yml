name: Deploy TPD Arena Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Ensure KV namespace
        run: node scripts/ensure-kv.mjs

      - name: Set worker secrets
        shell: bash
        run: |
          printf '{"BOT_TOKEN":"%s","WEBHOOK_SECRET":"%s"}' \
            "${{ secrets.BOT_TOKEN }}" "${{ secrets.WEBHOOK_SECRET }}" > .secrets.json
          npx wrangler secret bulk .secrets.json
          rm .secrets.json

      - name: Deploy
        id: deploy
        shell: bash
        run: |
          OUTPUT=$(npx wrangler deploy 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://tpd-arena-bot\.[a-zA-Z0-9-]+\.workers\.dev/?' | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not extract workers.dev URL from deploy output"
            exit 1
          fi
          echo "WORKER_URL=${URL%/}" >> "$GITHUB_ENV"

      - name: Set Telegram webhook
        shell: bash
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/deleteWebhook"
          echo
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook" \
            --data-urlencode "url=${{ env.WORKER_URL }}/hook" \
            --data-urlencode "secret_token=${{ secrets.WEBHOOK_SECRET }}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' \
            --data-urlencode "drop_pending_updates=true"
          echo

      - name: Set bot commands
        shell: bash
        run: |
          # The bot has exactly one command; everything else is a button.
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setMyCommands" \
            -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"arena","description":"Выйти на арену"}]}'
          echo

      - name: Check group privacy mode
        shell: bash
        run: |
          # With privacy ON, Telegram never delivers plain group text to the bot,
          # so taps on the bottom "Выйти на арену" keyboard never arrive.
          ME=$(curl -s "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getMe")
          if echo "$ME" | grep -q '"can_read_all_group_messages":true'; then
            echo "Group privacy is DISABLED — the bottom keyboard button works."
          else
            echo "::warning::Group privacy is ENABLED. Taps on the bottom keyboard button will not reach the bot. Disable it: @BotFather -> /setprivacy -> your bot -> Disable. Inline buttons work regardless."
          fi
